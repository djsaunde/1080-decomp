  # bootup_uso split into three: pre-text USO metadata/data/rodata/relocs,
  # text code (302 funcs, disassembled at VRAM=0 since LUIs are unrelocated
  # with upper16=0x0000), and post-text padding. The text VRAM=0 is a
  # synthetic address — this code actually gets loaded to a dynamic VRAM
  # at runtime by the USO loader; we match pre-relocation text bytes.
  #
  # bootup_uso_pre carved into three sub-bins (issue #6) to isolate the
  # embedded RSP ucode region (0xDB0000..0xDBA000): 11 gfx ucode payloads
  # (4 F3DEX 1.23 family + 7 SGI gfx ucodes whose data carries "RSP SW
  # Version: 2.0D / 2.0H" and "SGI U64 GFX SW TEAM"; none of them is audio)
  # sit between the head USO metadata and the tail rodata/reloc tables. Code
  # sections live before each ID string; data sections (0x800 each) end at
  # the string. The audio ucode (aspMain) is elsewhere: Text in game_libs
  # (game_libs_rsp_ucode_31DF8, ROM 0xE16EDC) and data image in bootup.uso
  # Data +0x1D340 (ROM 0xDBF730, 0x2E0 bytes); PC port plan section 15.2.
  - [0xD9FE28, bin, bootup_uso_pre_head]
  # bootup_uso_ucodes carved further: three of the gfx DMEM data sections
  # (0x800 each) byte-match Nintendo SDK F3DEX 1.23 stock builds shipped in
  # n64decomp/sm64 lib/PR/f3dex/*_data.bin (issue #6 fingerprint comment).
  # Naming them as separate bins documents the boundaries; remaining
  # opaque regions hold gfx IMEM + the 7 SGI gfx ucode entries (data
  # sections at the id-string-end pattern). No aspMain here (see above).
  - [0xDB0000, bin, bootup_uso_ucodes_head]
  - [0xDB7140, bin, bootup_uso_ucodes_F3DEX_NoN_data]
  - [0xDB7940, bin, bootup_uso_ucodes_F3DEX_data]
  - [0xDB8140, bin, bootup_uso_ucodes_mid]
  - [0xDB9140, bin, bootup_uso_ucodes_F3DLX_Rej_data]
  - [0xDB9940, bin, bootup_uso_ucodes_tail]
  - [0xDBA000, bin, bootup_uso_pre_tail]
  - name: bootup_uso
    type: code
    start: 0xDD0A6C
    vram: 0x00000000
    subsegments:
      - [0xDD0A6C, c, bootup_uso]
  # PointsGadget_display_FFFFFFE0 (bootup.uso Text offset 0x1464C, USO export 871):
  # the first game_libs function; its 8-word hoisted head lies 0x20 bytes before
  # game_libs VRAM 0. Was split across the old bootup_uso_post (0xDE50B8, 0x1C)
  # and game_libs_pre (0xDE50D4, 0x4) bins + gl_func_00000000 (run 144). Linked
  # as its own section (tenshoe.ld .game_libs_head); the vram here is nominal.
  - name: game_libs_head
    type: code
    start: 0xDE50B8
    vram: 0x00000000
    subsegments:
      - [0xDE50B8, c, game_libs/game_libs_head]
  # game_libs: 468 KB of raw relocatable text (1371 functions) followed by
  # ~11 KB of data tables. Same decomp pattern as bootup_uso: VRAM=0,
  # external symbol defs, per-.o matching. game_libs.c starts at VRAM 0x1CC.
  - name: game_libs
    type: code
    start: 0xDE52A4
    vram: 0x000001CC
    subsegments:
      - [0xDE52A4, c, game_libs/game_libs]
      # 56 KB mixed blob embedded mid-text. Forensics history:
      # - Initially misidentified as RSP microcode (feedback memo).
      # - Then re-fingerprinted 2026-05-04 as DL data (234 GFX opcodes; the
      #   GFX-opcode-count discriminator was wrong — it gave a false negative
      #   on the IMEM portion, see updated feedback memo).
      # - Then re-fingerprinted 2026-05-05 (issue #6 path-C work) and found:
      #   the blob is HALF CPU code, HALF F3DEX 1.23 RSP IMEM. sm64's
      #   lib/PR/f3dex/{F3DEX_NoN,F3DEX,F3DLX_Rej}.bin all byte-match exactly
      #   inside this region. Carved into per-IMEM sub-bins below.
      # The DMEM data tables (paired with these IMEMs) live in
      # bootup_uso_ucodes at 0xDB7140/7940/9140 (F3DLP_Rej_data only at
      # 0xDB8940 — no public ref).
      # 0xEBF8: ColourItem_create_0000EBF8, the one CPU function in the old
      # game_libs_text2_pre bin (a twin of ColourItem_create_0000C5B0); split
      # out 2026-11-16 (docs/ROM_COVERAGE.md). The rest is RSP IMEM.
      - [0xDF3CD0, c, game_libs/game_libs_EBF8]
      - [0xDF3D60, bin, game_libs_text2_rsp_pre]
      - [0xDFA43C, bin, game_libs_text2_F3DEX_NoN_imem]
      - [0xDFB86C, bin, game_libs_text2_F3DEX_imem]
      - [0xDFCC9C, bin, game_libs_text2_F3DLP_Rej_imem]
      - [0xDFE0CC, bin, game_libs_text2_mid]
      - [0xDFF2DC, bin, game_libs_text2_F3DLX_Rej_imem]
      - [0xE006AC, bin, game_libs_text2_tail]
      - [0xE01ABC, c, game_libs/game_libs_post]   # was 0xE01AE8: 11-word hoisted head of AudioSynth_InitNextRingBuf (run 136)
  - [0xE5A378, bin, game_libs_post]
  - [0xE5D0D4, bin, game_data]
  - [0x1000000]
