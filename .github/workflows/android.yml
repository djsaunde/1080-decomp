name: Android port

# plan section 31: the Android APK (arm64-v8a) of the wasm2c build. The game is built as wasm32 with wasi-sdk and
# translated to C by wasm2c (WABT, built here from its release source), as for macOS; the NDK compiles that C and the
# SDL2 / OpenGL ES 3.0 host into libmain.so, Gradle (SDL2's wrapper) packages it with SDLActivity. The APK is signed
# with a throwaway key made in the job (build-apk.sh --ci-key): installable, but an update signed with another key
# needs the old app uninstalled first. No ROM in CI: the checks are the build, the signature and the libraries in
# the APK.
on:
  push:
    branches: [port-android-ci, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  WASI_SDK_VERSION: "25"
  WABT_VERSION: "1.0.36"

jobs:
  android-port:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install ninja
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build

      - name: Android SDK, NDK r27c, SDL2 source
        run: |
          echo "ANDROID_TOOLS=${{ runner.temp }}/android" >> "$GITHUB_ENV"
          SKIP_JDK=1 ANDROID_TOOLS="${{ runner.temp }}/android" bash port/android/setup-android.sh

      - name: Fetch wasi-sdk, build wasm2c, fetch libultraship
        run: |
          T="${{ runner.temp }}/wasm"; mkdir -p "$T"; cd "$T"
          curl -sSfL -o wasi-sdk.tgz "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz"
          tar xzf wasi-sdk.tgz
          echo "WASI_SDK=$T/$(ls -d wasi-sdk-*-linux | head -1)" >> "$GITHUB_ENV"
          curl -sSfL -o wabt.tar.xz "https://github.com/WebAssembly/wabt/releases/download/${WABT_VERSION}/wabt-${WABT_VERSION}.tar.xz"
          tar xJf wabt.tar.xz
          cmake -S "wabt-${WABT_VERSION}" -B wabt-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF \
                -DBUILD_LIBWASM=OFF -DUSE_INTERNAL_SHA256=ON > wabt-cfg.log
          cmake --build wabt-build --target wasm2c
          echo "WASM2C=$T/wabt-build/wasm2c" >> "$GITHUB_ENV"
          echo "WASM2C_RT=$T/wabt-${WABT_VERSION}/wasm2c" >> "$GITHUB_ENV"
          cd "${{ github.workspace }}" && bash port/gfx/fast3d/setup-lus.sh

      - name: Build the APK
        run: |
          set +e
          bash port/android/build-apk.sh -o dist --ci-key --jobs 4 --version "0.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            for f in dist/wasm-build.log dist/gradle.log; do
              [ -f "$f" ] && grep -m20 -E 'error:|FAILED|What went wrong' "$f" | sed 's/^/::error::/'
            done
            tail -60 dist/gradle.log 2>/dev/null
            exit $rc
          fi
          cp port/android/README-android.txt dist/README.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: 1080-snowboarding-android-arm64
          path: |
            dist/1080-snowboarding.apk
            dist/README.txt
