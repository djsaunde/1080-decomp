name: Build & Report

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Progress is tracked on bytematch.dev, which ingests the `us_report` artifact
# (default pattern `^(?<version>.+)_report$`) from successful push runs on main.
# decomp.dev shut down 2026-10 (history importable via bytematch.dev manage page).
# concurrency cancels superseded runs so bursts of agent lands publish one report.
permissions:
  contents: read
  actions: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Install cross-assembler/linker
        run: sudo apt-get update && sudo apt-get install -y binutils-mips-linux-gnu

      - name: Download prebuilt IDO 7.1 and 5.3
        run: |
          mkdir -p tools/ido-static-recomp/build/7.1/out
          curl -sL https://github.com/decompals/ido-static-recomp/releases/download/v1.2/ido-7.1-recomp-linux.tar.gz \
            | tar xz -C tools/ido-static-recomp/build/7.1/out
          chmod +x tools/ido-static-recomp/build/7.1/out/*
          # IDO 5.3 is needed for the game_libs_ido53_* units (statically-linked
          # libultra originally built with IDO 5.3 -O1; see docs ido53-carve recipe)
          mkdir -p tools/ido-static-recomp/build/5.3/out
          curl -sL https://github.com/decompals/ido-static-recomp/releases/download/v1.2/ido-5.3-recomp-linux.tar.gz \
            | tar xz -C tools/ido-static-recomp/build/5.3/out
          chmod +x tools/ido-static-recomp/build/5.3/out/*

      - name: Fetch MIPSpro 7.2.1 C++ front end (per-function *_mp72_*.cpp donors)
        run: |
          # qemu-irix links libglib-2.0 (preinstalled on the runner) and libpcre.so.3
          sudo apt-get install -y libpcre3
          bash tools/fetch-mipspro721.sh

      - name: Build C objects (no baserom required)
        run: make RUN_CC_CHECK=0 -j$(nproc) objects

      - name: Build non_matching C objects (with -DNON_MATCHING for fuzzy scoring)
        run: make RUN_CC_CHECK=0 -j$(nproc) non_matching_objects

      - name: Generate progress report
        run: |
          curl -sL https://github.com/encounter/objdiff/releases/latest/download/objdiff-cli-linux-x86_64 -o objdiff-cli
          chmod +x objdiff-cli
          ./objdiff-cli report generate -p . -o report.json

      - name: Upload progress report
        uses: actions/upload-artifact@v4
        with:
          name: us_report
          path: report.json

  linux-port:
    runs-on: ubuntu-24.04

    env:
      LUS_TOOLS: ${{ github.workspace }}/build-linux/lus

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux port dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ ninja-build libegl-dev libgl-dev libx11-dev libpulse-dev

      - name: Fetch libultraship
        run: bash port/gfx/fast3d/setup-lus.sh

      - name: Build and package tenshoe
        run: |
          cmake -S port -B build-linux -G Ninja \
                -DPORT_64=ON -DPORT_NATIVE=ON -DPORT_LINK=ON -DPORT_RUNTIME_BLOBS=ON \
                -DPORT_LUS="$LUS_TOOLS" -DPORT_GL_DEV=/usr/include \
                -DPORT_NATIVE_X11_DEV=/usr/include -DPORT_NATIVE_PULSE_DEV=/usr/include
          cmake --build build-linux --target tenshoe -j"$(nproc)"

          package=dist-linux/tenshoe-linux-x86_64
          install -Dm755 build-linux/tenshoe "$package/tenshoe"
          strip "$package/tenshoe"
          install -Dm644 "$LUS_TOOLS/libultraship/LICENSE" "$package/licenses/libultraship/LICENSE"
          install -Dm644 "$LUS_TOOLS/libultraship/src/fast/LICENSE.txt" "$package/licenses/libultraship/FAST3D-LICENSE.txt"
          install -Dm644 "$LUS_TOOLS/prism/LICENSE" "$package/licenses/prism/LICENSE"
          tar -C dist-linux -czf dist-linux/tenshoe-linux-x86_64.tar.gz tenshoe-linux-x86_64

      - name: Check the packaged binary without a ROM
        run: |
          unpacked=$(mktemp -d)
          tar -C "$unpacked" -xzf dist-linux/tenshoe-linux-x86_64.tar.gz
          cd "$unpacked/tenshoe-linux-x86_64"
          status=0
          PORT_NATIVE=1 timeout 15s ./tenshoe --rom baserom.z64 --frames 1 > run.log 2>&1 || status=$?
          cat run.log
          test "$status" -eq 1
          grep -Fq 'cannot read the ROM baserom.z64' run.log

      - name: Upload Linux port
        uses: actions/upload-artifact@v4
        with:
          name: tenshoe-linux-x86_64
          path: dist-linux/tenshoe-linux-x86_64.tar.gz
          if-no-files-found: error

  # The 32-bit Windows build of the PC port (port/, plan section 29): cross-compiled, no ROM needed (the
  # executable reads the user's ROM at run time). Independent of the matching build above.
  windows-port:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Install mingw-w64 (i686, posix threads) and ninja
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-i686-posix ninja-build

      - name: Fetch SDL2 (mingw) and libultraship
        run: |
          SKIP_MINGW=1 bash port/win32/setup-mingw.sh
          bash port/gfx/fast3d/setup-lus.sh

      - name: Build tenshoe.exe
        run: |
          cmake -S port -B build-win -G Ninja -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/port/win32/mingw-i686.cmake \
                -DMINGW_ROOT=/usr -DPORT_WIN32=ON -DPORT_LINK=ON
          cmake --build build-win --target tenshoe -j$(nproc)
          mkdir -p dist
          i686-w64-mingw32-strip -o dist/tenshoe.exe build-win/tenshoe.exe
          cp port/win32/README-windows.txt dist/README.txt

      - name: Upload tenshoe.exe
        uses: actions/upload-artifact@v4
        with:
          name: tenshoe-windows-i686
          path: dist/
